# IEC104 remote endpoint.
host=127.0.0.1
port=2404
connect_timeout_ms=3000
receive_timeout_ms=5000
reconnect_ms=2000
status_interval_ms=1000

# Persistent local cache. The file is trimmed as a ring buffer.
cache_path=data/cache.log
cache_max_records=10000

# Point 1001: analog telemetry, mock server sends M_ME_NC_1 float values.
point.1001.name=Main transformer load
point.1001.type=analog
point.1001.unit=MW
point.1001.high_high=95
point.1001.high=85
point.1001.low=10
point.1001.low_low=5
point.1001.stale_seconds=15

# Point 1002: analog telemetry, mock server sends M_ME_NC_1 float values.
point.1002.name=Bus voltage
point.1002.type=analog
point.1002.unit=kV
point.1002.high_high=235
point.1002.high=230
point.1002.low=205
point.1002.low_low=198
point.1002.stale_seconds=15

# Point 2001: digital telemetry, normal closed state is 1.
point.2001.name=Breaker QF1
point.2001.type=digital
point.2001.normal_state=1
point.2001.stale_seconds=20

