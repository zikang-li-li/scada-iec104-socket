# Multi-RTU IEC104 access configuration.
# Format:
#   device.<id>.<attribute>=value
#   device.<id>.point.<ioa>.<attribute>=value
#
# The same IOA can appear under different devices. The runtime key is device_id + IOA.

status_interval_ms=1000
cache_path=data/cache.log
cache_max_records=10000
log_path=logs/scada_client.log
log_level=info
log_console=true
log_append=true

# Device 1: 110 kV station RTU.
device.rtu_110kv.name=110kV East Substation RTU
device.rtu_110kv.enabled=true
device.rtu_110kv.host=127.0.0.1
device.rtu_110kv.port=2404
device.rtu_110kv.common_address=1
device.rtu_110kv.connect_timeout_ms=3000
device.rtu_110kv.receive_timeout_ms=5000
device.rtu_110kv.reconnect_ms=3000
device.rtu_110kv.heartbeat_interval_ms=10000
device.rtu_110kv.heartbeat_timeout_ms=3000

device.rtu_110kv.point.1001.name=110kV main transformer load
device.rtu_110kv.point.1001.type=analog
device.rtu_110kv.point.1001.unit=MW
device.rtu_110kv.point.1001.high_high=95
device.rtu_110kv.point.1001.high=85
device.rtu_110kv.point.1001.low=10
device.rtu_110kv.point.1001.low_low=5
device.rtu_110kv.point.1001.stale_seconds=15

device.rtu_110kv.point.1002.name=110kV bus voltage
device.rtu_110kv.point.1002.type=analog
device.rtu_110kv.point.1002.unit=kV
device.rtu_110kv.point.1002.high_high=235
device.rtu_110kv.point.1002.high=230
device.rtu_110kv.point.1002.low=205
device.rtu_110kv.point.1002.low_low=198
device.rtu_110kv.point.1002.stale_seconds=15

device.rtu_110kv.point.2001.name=110kV breaker QF1
device.rtu_110kv.point.2001.type=digital
device.rtu_110kv.point.2001.normal_state=1
device.rtu_110kv.point.2001.stale_seconds=20

# Optional telecontrol point example. Incoming control command handling can map this
# type to business log category "Telecontrol".
# device.rtu_110kv.point.3001.name=110kV breaker QF1 remote close/open command
# device.rtu_110kv.point.3001.type=control

# Device 2: another station RTU. It intentionally reuses IOA 1001/1002/2001.
device.rtu_west.name=110kV West Substation RTU
device.rtu_west.enabled=true
device.rtu_west.host=127.0.0.1
device.rtu_west.port=2405
device.rtu_west.common_address=1
device.rtu_west.connect_timeout_ms=3000
device.rtu_west.receive_timeout_ms=5000
device.rtu_west.reconnect_ms=3000
device.rtu_west.heartbeat_interval_ms=10000
device.rtu_west.heartbeat_timeout_ms=3000

device.rtu_west.point.1001.name=West transformer load
device.rtu_west.point.1001.type=analog
device.rtu_west.point.1001.unit=MW
device.rtu_west.point.1001.high_high=95
device.rtu_west.point.1001.high=85
device.rtu_west.point.1001.low=10
device.rtu_west.point.1001.low_low=5
device.rtu_west.point.1001.stale_seconds=15

device.rtu_west.point.1002.name=West bus voltage
device.rtu_west.point.1002.type=analog
device.rtu_west.point.1002.unit=kV
device.rtu_west.point.1002.high_high=235
device.rtu_west.point.1002.high=230
device.rtu_west.point.1002.low=205
device.rtu_west.point.1002.low_low=198
device.rtu_west.point.1002.stale_seconds=15

device.rtu_west.point.2001.name=West breaker QF2
device.rtu_west.point.2001.type=digital
device.rtu_west.point.2001.normal_state=1
device.rtu_west.point.2001.stale_seconds=20
